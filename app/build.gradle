plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.inforti.calceletrica'
    compileSdk 35

    defaultConfig {
        applicationId "br.com.inforti.calceletrica"
        minSdk 23
        targetSdk 35
        versionCode 31
        versionName "3.0.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
