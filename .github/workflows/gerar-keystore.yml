name: Criar Keystore Calc-Eletrica

on:
  workflow_dispatch:

jobs:
  criar-keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Criar keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          keytool -genkeypair \
            -v \
            -keystore calc-eletrica-release.jks \
            -storetype JKS \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            -dname "CN=Calc-Eletrica, OU=Infor-TI, O=Infor-TI, L=Petrópolis, ST=RJ, C=BR"

      - name: Disponibilizar keystore
        uses: actions/upload-artifact@v4
        with:
          name: calc-eletrica-keystore
          path: calc-eletrica-release.jks
          if-no-files-found: error
