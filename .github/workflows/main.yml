name: Gerar APK Calc-Eletrica

on:
  workflow_dispatch:
  push:
    branches:
      - main      - name: Restaurar keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          printf '%s\n' "$KEYSTORE_BASE64" \
            | sed '/BEGIN CERTIFICATE/d;/END CERTIFICATE/d' \
            | tr -d '\r\n ' \
            | base64 --decode > calc-eletrica-release.jks

      - name: Criar configuração de assinatura
        env:
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=$PWD/calc-eletrica-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      - name: Verificar projeto
        run: |
          gradle projects

      - name: Compilar APK Release assinado
        run: |
          gradle --no-daemon assembleRelease

      - name: Procurar APK
        run: |
          echo "===== APKs encontrados ====="
          find app/build/outputs -type f -name "*.apk" -print

      - name: Disponibilizar APK Release
        uses: actions/upload-artifact@v4
        with:
          name: Calc-Eletrica-3.0.1-Release-Assinado
          path: app/build/outputs/**/*.apk
          if-no-files-found: error

      - name: Limpar arquivos de assinatura
        if: always()
        run: |
          rm -f calc-eletrica-release.jks
          rm -f keystore.properties
