name: Gerar APK Calc-Eletrica

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK Android
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Restaurar keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > calc-eletrica-release.jks

      - name: Criar configuração de assinatura
        env:
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=$PWD/calc-eletrica-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      - name: Verificar projeto
        run: |
          gradle projects

      - name: Compilar APK Release assinado
        run: |
          gradle --no-daemon assembleRelease

      - name: Procurar APK
        run: |
          echo "===== APKs encontrados ====="
          find app/build/outputs -type f -name "*.apk" -print

      - name: Disponibilizar APK Release
        uses: actions/upload-artifact@v4
        with:
          name: Calc-Eletrica-3.0.1-Release-Assinado
          path: app/build/outputs/**/*.apk
          if-no-files-found: error

      - name: Limpar arquivos de assinatura
        if: always()
        run: |
          rm -f calc-eletrica-release.jks
          rm -f keystore.properties
